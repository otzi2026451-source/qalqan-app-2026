<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QALQAN — цифровая экосистема Академии, AI, Market, services, eGov и личный кабинет студента.">
  <meta name="theme-color" content="#111E2F">
  <title>QALQAN</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Arial, sans-serif; background: linear-gradient(135deg, #071827 0%, #111e2f 40%, #0e1d31 100%); color: #f3f8ff;
    }
    .card {
      width: min(760px, 90vw); padding: 48px 36px; border-radius: 22px; background: rgba(12, 22, 35, 0.86);
      border: 1px solid rgba(150, 196, 255, 0.16); box-shadow: 0 30px 80px rgba(0,0,0,0.35); text-align: center;
    }
    .eyebrow { letter-spacing: 0.16em; text-transform: uppercase; color: #7dd3fc; font-size: 12px; font-weight: 700; }
    h1 { font-size: clamp(2.1rem, 5vw, 4rem); margin: 14px 0 12px; }
    p { font-size: 1.06rem; color: #cfe5ff; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">QALQAN</div>
    <h1>Страница не найдена</h1>
    <p>Экосистема QALQAN обновлена, и старая ILYAS BANK версия больше не используется.</p>
  </main>
</body>
</html>
